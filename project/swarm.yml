version: "3"

services:

  caddy-ws:
    image: rmbogne/micro-caddy:1.0.0
    deploy:
      mode: replicated
      replicas: 1
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  front-end:
    image: rmbogne/front-end:1.0.2
    deploy:
      mode: replicated
      replicas: 1
    environment:
      BROKER_URL: "http://backend"

  broker-service:
    image: rmbogne/broker-service:1.0.3
    deploy:
      mode: replicated
      replicas: 1
  
  listener-service:
    image: rmbogne/listener-service:1.0.0
    deploy:
      mode: replicated
      replicas: 1

  postgres:
    image: 'postgres:14.2'
    ports:
      - "5432:5432"
    restart: always
    deploy:
      mode: replicated
      replicas: 1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: users
    volumes:
      - ./db-data/postgres/:/var/lib/postgresql/data/

  authentication-service:
    image: rmbogne/authentication-service:1.0.2
    deploy:
      mode: replicated
      replicas: 1
    environment:
      DSN: "host=postgres port=5432 user=postgres password=password dbname=users sslmode=disable timezone=UTC connect_timeout=5"

  logger-service:
    image: rmbogne/logger-service:1.0.2
    deploy:
      mode: replicated
      replicas: 1

  mailer-service:
    image: rmbogne/mailer-service:1.0.2
    deploy:
      mode: replicated
      replicas: 1
    environment:
      EMAIL_DOMAIN: localhost
      EMAIL_HOST: mailhog
      EMAIL_PORT: 1025
      EMAIL_ENCRYPTION: none
      EMAIL_USERNAME: ""
      EMAIL_PASSWORD: ""
      FROM_NAME: "Romuald MBOGNE"
      FROM_ADDRESS: "romuald.mbogne@example.com"

  rabbitmq:
    image: 'rabbitmq:4.0-alpine'
    deploy:
      mode: global

  mailhog:
    image: 'jcalonso/mailhog:latest'
    ports:
      - "8025:8025"
    deploy:
      mode: global

  mongo:
    image: 'mongo:4.2.16-bionic'
    ports: 
      - "27017:27017"
    deploy:
      mode: global
    environment:
      MONGO_INITDB_DATABASE: logs
      MONGO_INITDB_USERNAME: admin
      MONGO_INITDB_PASSWORD: password
    volumes:
      - ./db-data/mongo/:/data/db
  


volumes:
  caddy_data:
    external: true
  caddy_config: