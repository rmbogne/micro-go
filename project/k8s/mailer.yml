apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailer-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailer-service
  template:
    metadata:
      labels:
        app: mailer-service
    spec:
      replicas: 1
      containers:
        - name: mailer-service
          image: "rmbogne/mailer-service:1.0.2"
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          ports:
            - containerPort: 27017
          env:
            - name: EMAIL_DOMAIN
              value: ""
            - name: EMAIL_HOST
              value: "localhost"
            - name: EMAIL_PORT
              value: "1025"
            - name: EMAIL_ENCRYPTION
              value: "none"
            - name: EMAIL_USERNAME
              value: ""
            - name: EMAIL_PASSWORD
              value: ""
            - name: FROM_NAME
              value: "Romuald MBOGNE"
            - name: FROM_ADDRESS
              value: "romuald.mbogne@example.com"

---

apiVersion: v1
kind: Service
metadata:
  name: mailer-service
spec:
  selector:
    app: mailer-service
  ports:
  - protocol: TCP
    name: main-port
    port: 80
    targetPort: 80